name: 월간 정책 분석 갱신

on:
  schedule:
    # 09:00 UTC = 18:00 Asia/Seoul
    - cron: '0 9 1-7 * *'
    - cron: '0 9 10,15,20,25 * *'
  workflow_dispatch:
    inputs:
      execution_mode:
        description: '실행 방식: 자료 확인 / 시험 실행 / 정식 반영'
        required: true
        default: 'test'
        type: choice
        options:
          - check
          - test
          - publish
      source_month:
        description: '특정 기준월(YYYYMM, 생략하면 최신 대상월)'
        required: false
        type: string
      offline:
        description: '외부 경로 API 없이 저장된 경로만 사용'
        required: true
        default: false
        type: boolean
      confirm_reviewed_change:
        description: '변화 요약을 사람이 확인한 뒤 큰 변화의 반영을 계속함'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-policy-release
  cancel-in-progress: false

jobs:
  update-policy-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      SGIS_CONSUMER_KEY: ${{ secrets.SGIS_CONSUMER_KEY }}
      SGIS_CONSUMER_SECRET: ${{ secrets.SGIS_CONSUMER_SECRET }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      VITE_KAKAO_MAP_APP_KEY: ${{ secrets.VITE_KAKAO_MAP_APP_KEY }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      POLICY_RELEASE_BOT_APP_ID: ${{ secrets.POLICY_RELEASE_BOT_APP_ID }}
      POLICY_RELEASE_BOT_PRIVATE_KEY: ${{ secrets.POLICY_RELEASE_BOT_PRIVATE_KEY }}

    steps:
      - name: 임시 저장소 권한 발급
        id: app-token
        if: ${{ env.POLICY_RELEASE_BOT_APP_ID != '' && env.POLICY_RELEASE_BOT_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.POLICY_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.POLICY_RELEASE_BOT_PRIVATE_KEY }}

      - name: 코드 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 분석 도구 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install scikit-learn matplotlib seaborn
          npm ci --prefix frontend

      - name: 실행 방식 결정
        id: options
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "source_month=" >> "$GITHUB_OUTPUT"
            echo "offline=false" >> "$GITHUB_OUTPUT"
            echo "confirm_reviewed_change=false" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.execution_mode }}" >> "$GITHUB_OUTPUT"
            echo "source_month=${{ inputs.source_month }}" >> "$GITHUB_OUTPUT"
            echo "offline=${{ inputs.offline }}" >> "$GITHUB_OUTPUT"
            echo "confirm_reviewed_change=${{ inputs.confirm_reviewed_change }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 월간 분석 확인 및 준비
        id: monthly
        shell: bash
        run: |
          RUN_ID="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          COMMAND=(python -X utf8 backend/scripts/monthly_policy_release.py --mode "${{ steps.options.outputs.mode }}" --run-id "$RUN_ID")
          if [[ -n "${{ steps.options.outputs.source_month }}" ]]; then
            COMMAND+=(--source-month "${{ steps.options.outputs.source_month }}")
          fi
          if [[ "${{ steps.options.outputs.offline }}" == "true" ]]; then
            COMMAND+=(--offline)
          fi
          if [[ "${{ steps.options.outputs.confirm_reviewed_change }}" == "true" ]]; then
            COMMAND+=(--confirm-reviewed-change)
          fi
          set +e
          "${COMMAND[@]}"
          COMMAND_EXIT=$?
          set -e
          RESULT_PATH="tmp/policy-release/$RUN_ID/run_result.json"
          export RESULT_PATH
          python -X utf8 - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RESULT_PATH"])
          payload = json.loads(result_path.read_text(encoding="utf-8"))
          print(payload["status_label"])
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"state={payload['state']}\n")
              output.write(f"version={payload.get('version') or ''}\n")
              output.write(f"result_path={result_path.as_posix()}\n")
              output.write(f"change_summary_path={payload.get('change_summary_path') or ''}\n")
          PY
          if [[ "$COMMAND_EXIT" -ne 0 ]]; then
            exit "$COMMAND_EXIT"
          fi

      - name: Python 분석과 백엔드 검사
        if: ${{ steps.monthly.outputs.state == 'published' }}
        run: |
          python -m pytest tests/unit/ai_model -q
          cd backend
          python -m pytest ../tests/unit/backend ../tests/integration/backend -q

      - name: 프론트 검사
        if: ${{ steps.monthly.outputs.state == 'published' }}
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: 결과 재생성 일치 확인
        if: ${{ steps.monthly.outputs.state == 'published' }}
        run: |
          python ai-model/build_policy_release.py
          git diff --check

      - name: 실행 근거 보관
        if: ${{ always() && steps.monthly.outputs.result_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: monthly-policy-analysis-${{ github.run_id }}
          path: |
            ${{ steps.monthly.outputs.result_path }}
            ${{ steps.monthly.outputs.change_summary_path }}
          if-no-files-found: error
          retention-days: 90

      - name: 자동 반영용 임시 권한 확인
        if: ${{ steps.monthly.outputs.state == 'published' && steps.app-token.outputs.token == '' }}
        run: |
          echo "정식 반영에는 POLICY_RELEASE_BOT_APP_ID와 POLICY_RELEASE_BOT_PRIVATE_KEY가 필요합니다."
          exit 1

      - name: 검증된 변경 제안 만들기
        if: ${{ steps.monthly.outputs.state == 'published' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VERSION: ${{ steps.monthly.outputs.version }}
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "검증된 변경이 없어 변경 제안을 만들지 않습니다."
            exit 0
          fi
          BRANCH="automation/monthly-policy-${VERSION}-${GITHUB_RUN_ID}"
          git config user.name "golden-governance-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- \
            data/raw/population \
            data/analysis \
            data/processed \
            frontend/public/data \
            frontend/src/data \
            frontend/src/assets \
            docs/reports
          git diff --cached --check
          git commit -m "chore: ${VERSION} 월간 정책 분석 갱신"
          git push --set-upstream origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: ${VERSION} 월간 정책 분석 갱신" \
            --body "공식 연령별 인구 확인, 150개 행정동 검증, VDI·후보·도로 경로 재분석 및 프론트 공개본 동시 갱신")
          gh pr merge "$PR_URL" --auto --squash
