name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때마다 작동

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Version
        run: npm run build
        env:
          # Kakao JavaScript 앱 키는 공개 번들에 포함되는 식별자이며 허용 도메인으로 제한한다.
          VITE_KAKAO_MAP_APP_KEY: ${{ secrets.VITE_KAKAO_MAP_APP_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          commit_message: "deploy: 깃허브 페이지 데모 버전 자동 배포"

      - name: Verify published policy analysis version
        working-directory: .
        shell: bash
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          LOCAL_POINTER="frontend/public/data/policy_release.latest.json"
          export SITE_URL LOCAL_POINTER GITHUB_RUN_ID
          python -X utf8 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          with open(os.environ["LOCAL_POINTER"], encoding="utf-8") as source:
              local_pointer = json.load(source)

          site_url = os.environ["SITE_URL"]
          run_id = os.environ["GITHUB_RUN_ID"]
          expected_version = local_pointer["version"]
          expected_hash = local_pointer["bundle_sha256"]
          report_path = Path(
              "frontend/public/data/reports/"
              "daegu-golden-time-policy-analysis-report.pdf"
          )
          expected_report_hash = hashlib.sha256(report_path.read_bytes()).hexdigest()
          last_error = "공개 사이트가 아직 이전 버전을 제공하고 있습니다."

          for attempt in range(1, 25):
              cache_key = f"run={run_id}&attempt={attempt}"
              pointer_url = f"{site_url}data/policy_release.latest.json?{cache_key}"
              try:
                  request = urllib.request.Request(
                      pointer_url,
                      headers={
                          "Cache-Control": "no-cache",
                          "User-Agent": "golden-project-deploy-check",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      remote_pointer = json.load(response)

                  if remote_pointer.get("version") != expected_version:
                      last_error = (
                          f"공개 버전 {remote_pointer.get('version')} != "
                          f"배포 버전 {expected_version}"
                      )
                  else:
                      bundle_url = f"{site_url}{remote_pointer['bundle_url']}?{cache_key}"
                      with urllib.request.urlopen(bundle_url, timeout=30) as response:
                          bundle = response.read()
                      actual_hash = hashlib.sha256(bundle).hexdigest()
                      if actual_hash == expected_hash:
                          report_url = (
                              f"{site_url}data/reports/"
                              "daegu-golden-time-policy-analysis-report.pdf"
                              f"?{cache_key}"
                          )
                          with urllib.request.urlopen(report_url, timeout=30) as response:
                              report = response.read()
                          actual_report_hash = hashlib.sha256(report).hexdigest()
                          if actual_report_hash == expected_report_hash:
                              print(
                                  "공개 분석 버전·정책보고서 검증 완료: "
                                  f"{expected_version}"
                              )
                              break
                          last_error = (
                              "공개 정책보고서 해시 불일치: "
                              f"{actual_report_hash}"
                          )
                          continue
                      last_error = f"공개 분석 파일 해시 불일치: {actual_hash}"
              except Exception as error:
                  last_error = f"공개 사이트 확인 실패: {error}"

              print(f"[{attempt}/24] {last_error}; 10초 후 다시 확인합니다.")
              time.sleep(10)
          else:
              raise SystemExit(last_error)
          PY
