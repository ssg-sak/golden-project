name: Verify application and policy pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  python:
    name: Backend, analysis, and policy release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-analysis.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r requirements-analysis.txt

      - name: Run Python tests
        run: python -m pytest tests/ -q

      - name: Validate and rebuild the committed policy release
        run: python ai-model/build_policy_release.py

      - name: Rebuild the external operational reference
        run: python scripts/external_validity_validation.py

      - name: Regenerate the canonical policy report
        run: python scripts/generate_portfolio_pdf.py

      - name: Verify generated and published reports are byte-identical
        run: >-
          cmp --silent
          output/pdf/daegu-golden-time-policy-analysis-report.pdf
          frontend/public/data/reports/daegu-golden-time-policy-analysis-report.pdf

      - name: Regenerate EDA artifacts
        run: python scripts/generate_eda_portfolio.py

      - name: Execute and validate the EDA notebook
        run: >-
          python scripts/execute_eda_notebook.py
          --verify-committed-source

      - name: Verify the policy release remains deterministic
        run: >-
          git diff --exit-code --
          data/processed/policy_release.json
          frontend/public/data/policy_release.json
          docs/reports/EDA_REPORT.md
          data/validation/ems_response_time_reference_20240801.json
          docs/reports/EXTERNAL_VALIDITY_REPORT.md
          frontend/public/data/reports/daegu-golden-time-policy-analysis-report.pdf
